# src/hpc_bridge/catalog/seed/anvil.yaml
# Curated Anvil (Purdue/ACCESS) — reached through its facility-run multi-user endpoint ONLY (decision 2026-09-04:
# the registry encourages the MEP over SSH; the retired SSH-bootstrap entry lives on as the known-good BYO
# reference in tests/catalog_fixtures/anvil-ssh.yaml). Anvil over SSH is still possible as bring-your-own.

# Anvil's facility-run MULTI-USER endpoint (deployed; described in Purdue's GlobusWorld 2025 talk, not in the
# RCAC user docs). Zero SSH: the facility maps the user's ACCESS identity to their x-… account. Its schema is
# STRICT (additionalProperties: false): only account, partition, qos, walltime, cores_per_node, mem_per_node,
# constraint, exclusive, min/max/init_blocks, nodes_per_block, scheduler_options, resource_specification,
# worker_init, endpoint_setup, venvs_dir, requirements — everything else is dropped at attach. Its default
# worker_init installs the worker at the CLIENT's SDK version; we pin the facility's ({gce_version}).
- id: anvil                       # the registry's ONE Anvil entry: the multi-user endpoint (the SSH entry was retired 2026-09-04)
  facility_key: purdue
  facility: "Purdue / ACCESS"
  description: "Anvil via its multi-user endpoint — zero SSH; the Slurm account is your ACCESS project id (e.g. cis250223; -gpu for GPU)"
  display_name: "Purdue Anvil (MEP)"
  aliases: [anvil-mep, anvil-multi-user, anvil.rcac.purdue.edu]
  compute_mep_uuid: 5aafb4c1-27b2-40d8-a038-a0277611868f
  ssh_host: null
  auth_method: ssh-key
  allocation: null
  account_required: true
  compute:
    scheduler: slurm
    interface: ib0                  # informational: the facility template pins its own address
    # Anvil's template rebuilds the user endpoint's venv at the LATEST compatible versions at every start (it moved
    # to parsl 2026.10.05 the day it was released): the worker installs with --upgrade to resolve the same. A worker
    # venv only re-checked for gce kept parsl 2026.08.10, and the endpoint dropped every result (2026-10-06).
    env_setup: 'export PATH="$HOME/.local/bin:$PATH"; command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh; V=$HOME/hpc-bridge/gce-venv-{gce_version}-py{python_version}; [ -d $V ] || uv venv $V --python {python_version}; . $V/bin/activate; uv pip install -q --upgrade "globus-compute-endpoint=={gce_version}"'
    # Anvil's template builds the USER endpoint's environment at the CLIENT's SDK version (its UEP logged
    # 4.16.0 while the manager metadata says 4.12.0): the worker pool must match the UEP, i.e. the client.
    worker_version: client
    worker_env:
      strategy: float
      verified_with: "4.16.0"
    scratch_root: "$HOME/.hpc-bridge"
    endpoint_name: anvil-mep
  defaults:
    partition: shared               # the template's own default; charged per core-hour
    walltime: "00:15:00"
    max_workers_per_node: 1
    nodes_per_block: 1
    init_blocks: 1
    max_blocks: 1
    extra:
      cores_per_node: 1
  provenance: curated
  last_validated: 2026-09-04

