# src/hpc_bridge/catalog/seed/globus-cluster.yaml
# Curated Globus Labs cluster (registry id `globus-labs`; the machine is `globus1`) via its facility-run MULTI-USER endpoint
# (`globus-cluster-mep`, deployed 2026-08-18; cluster vault Reference/08c, decision D-034).
#
# This is a MEP entry: NO ssh_host, NO allocation listing. hpc-bridge never SSHes here — the
# facility's identity mapping (Globus identity -> local account) is the access, and every command
# is dispatched over AMQP to the MEP UUID. There is NO login shape (the MEP schema rejects
# LocalProvider / compute:false); low-latency comes from a warm Slurm block (init_blocks: 1).
- id: globus-labs                 # renamed from `globus1` 2026-09-04 (the id names the facility, not a host)
  facility_key: globus
  facility: "Globus Labs cluster"
  description: "lab DGX Spark cluster (4 compute nodes spark1-4, GB10, ARM, Slurm `main`, 2-day walltime) via its multi-user endpoint — zero SSH"
  display_name: "Globus Labs cluster (MEP)"
  aliases: [globus1, globus-cluster-mep, globus1-mep]   # bundled-loader lookups only; the registry resolves the id
  compute_mep_uuid: da3df250-4013-4d69-942c-eef1568f860c
  ssh_host: null                    # MEP entry: dispatch-only, no SSH reach
  auth_method: ssh-key              # unused on a MEP (no SSH); kept for the v1 schema literal
  allocation: null                  # no login-node channel on a MEP -> no allocation listing
  account_required: false           # AccountingStorageEnforce=none: --account optional (`lab` exists)
  compute:
    scheduler: slurm
    interface: enP7s7               # ignored by the MEP since its 2026-10-01 rebuild; the entry schema requires it
    # worker_init runs on the compute node AS THE MAPPED USER. Must be self-contained and must pin
    # the endpoint's exact globus-compute-endpoint version UNCONDITIONALLY: the MEP runs 4.15.0 and
    # a version-skewed worker fails every job with a cryptic `process_worker_pool.py: -P/--port`
    # error. (No `command -v … ||` guard — that silently keeps a wrong-version venv.)
    env_setup: "[ -d $HOME/hpc-bridge/gce-venv ] || uv venv $HOME/hpc-bridge/gce-venv; . $HOME/hpc-bridge/gce-venv/bin/activate; uv pip install -q globus-compute-endpoint==4.15.0 parsl==2026.4.20"
    worker_env:
      strategy: pin                 # the MEP's own fixed install; gce 4.15.0 itself pins parsl==2026.4.20 (stated)
      verified_with: "4.15.0"
    scratch_root: "$HOME/.hpc-bridge"   # worker-side form: we can't know the mapped local user client-side
    endpoint_name: globus-cluster-mep
  defaults:
    partition: main
    walltime: "02:00:00"            # the warm-block "login replacement": long enough to stay warm; unmetered
    max_workers_per_node: 2
    nodes_per_block: 1
    init_blocks: 1                  # pre-spawn one block so the first call doesn't pay the queue
    max_blocks: 1
  provenance: curated
  last_validated: 2026-10-09
  verification:                    # written by agentic/registry_reprove.py — what the live run met
    verified_on: 2026-10-09
    endpoint_version: "4.15.0"
    python_version: "3.12.3"
    template_sha256: "0f821f5bf04d59571b9db72181d22f1f92523d9d93f165e3eb508b6efccc3734"
    config_sha256: "0080e7748e6e3007437372e742822766e6e8f1fde9c1b2fd5ce63bbfb266dd3f"
    worker: "py3.12.3 dill0.3.9 parsl2026.4.20 on spark4"
