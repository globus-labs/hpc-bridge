# hpc-bridge fake cluster — slurm.conf for the `site` profile (mounted from profiles/site/ at run time).
# Deliberately minimal and container-friendly: no cgroups, no task affinity, munge auth,
# accounting through slurmdbd so `sacct` works (the harness postchecks read squeue/sacct).
ClusterName=fake
SlurmctldHost=slurmctld

AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SwitchType=switch/none
ReturnToService=2
MailProg=/bin/true

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldPort=6817
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm

# Containers all see the host VM's CPUs/RAM; config_overrides makes slurmd trust the NodeName
# line instead of refusing to register on a hardware mismatch.
SlurmdParameters=config_overrides

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# Accounting via slurmdbd (+ MariaDB), ENFORCED: a job's account must be a valid association (a wrong account is
# rejected at submit), QOS limits apply (the `debug` QOS caps walltime at 30 min), and partitions may restrict
# accounts (gpu -> hpcb-gpu only). Users default to account `hpcb` (set up by setup.d/slurmctld.sh). `safe`: a job
# that could pass an association's GrpTRESMins (the site backstop an envelope's terms may name) is held from starting —
# without it Slurm starts the job and only stops what follows (live 2026-11-01, site_backstop_named_and_enforced).
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos,safe
JobAcctGatherType=jobacct_gather/none

# A site rule, the way Delta's is: a job on the gpu partition must ask for a GPU (job_submit.lua).
JobSubmitPlugins=lua
GresTypes=gpu
# Reject at SUBMIT a job that exceeds its partition's limits (a 1 h job on the 30-min `debug`), the way sites do —
# the default (NO) accepts it and leaves it PENDING with PartitionTimeLimit forever.
EnforcePartLimits=ALL

SlurmctldDebug=info
SlurmdDebug=info

# Three compute nodes; c3 carries two (declared, device-less) GPUs. Three partitions: `debug` (one node, 30 min,
# the debug QOS), `compute` (the default; all nodes; 2 days), `gpu` (c3; hpcb-gpu only; 1 day).
NodeName=c[1-2] CPUs=4 RealMemory=4000 State=UNKNOWN
NodeName=c3 CPUs=4 RealMemory=4000 Gres=gpu:2 State=UNKNOWN
PartitionName=debug   Nodes=c1     Default=NO  MaxTime=00:30:00   QOS=debug State=UP
PartitionName=compute Nodes=c[1-3] Default=YES MaxTime=2-00:00:00 State=UP
PartitionName=gpu     Nodes=c3     Default=NO  MaxTime=1-00:00:00 AllowAccounts=hpcb-gpu State=UP
