# A site-like Slurm: three compute nodes; debug / compute / gpu partitions with QOS walltime caps; accounting
# ENFORCED (a wrong account is rejected; the gpu partition takes only hpcb-gpu); a job_submit rule that rejects a
# gpu job without a GPU request (Delta's shape); a fake `mybalance` on PATH (Anvil's format, so discovery finds an
# allocation tool and the parser gets an end-to-end path); two NICs (eth0/eth1 — the interface pick is a real
# decision); and TWO login nodes behind the round-robin name `login` (login01.hpcb.test / login02.hpcb.test share
# host keys like a real site does), so the endpoint lands on one and later control-plane SSH must reach THAT one
# (the login-node pin, the class behind this week's Expanse bugs).
# job_submit.lua (copied to /etc/slurm, readable on the nodes) carries only a site-style comment: its rule is the one NCSA
# Delta's GPU partitions enforce, and the plugin's discovery/gate must surface it rather than let the block PEND or fail.
# It used to say so in the file itself, which announced the test to an agent that read it (codex gpu_rule, 2026-10-23).
name = "site"
description = "site-like Slurm — 3 nodes, debug/compute/gpu, QOS caps, enforced accounting, fake mybalance, 2 NICs, 2 login nodes (round-robin)"

[capabilities]
scheduler = "slurm"
nodes = 3
login_nodes = 2
login_hosts = ["login01.hpcb.test", "login02.hpcb.test"]
partitions = ["debug", "compute", "gpu"]
default_partition = "compute"
accounting = "enforce"
accounts = ["hpcb", "hpcb-gpu"]
balance_tool = "mybalance"
nics = 2
qos = ["normal", "debug"]
gres = "gpu"
module_system = "none"
mfa = "none"
