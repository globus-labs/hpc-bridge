# hpc-bridge fake cluster — slurm.conf for the `slices` profile (mounted from profiles/slices/ at run time): the
# `default` cluster, with cores AND memory consumable (CR_Core_Memory) and three partitions on its two nodes — `main`
# (the default, as on `default`), `shared` (per core: OverSubscribe=NO, a per-core memory default, billed per core) and
# `whole` (OverSubscribe=EXCLUSIVE: whole nodes only). Resource requests (2026-10-24): what discovery must classify, and
# what sacct's AllocCPUS / ReqMem / NNodes must show a block got.
ClusterName=fake
SlurmctldHost=slurmctld

AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SwitchType=switch/none
ReturnToService=2
MailProg=/bin/true

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldPort=6817
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm

# Containers all see the host VM's CPUs/RAM; config_overrides makes slurmd trust the NodeName
# line instead of refusing to register on a hardware mismatch.
SlurmdParameters=config_overrides

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
# Cores and memory are both consumable: a job's slice of a node is its CPUs and its memory (a job without --mem gets
# DefMemPerCPU per core), so two blocks share a node — and a job with no memory default would hold the whole node's.
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=500

# Accounting via slurmdbd (+ MariaDB) — what makes `sacct`/`sacctmgr` real. No enforcement, so a
# job needs no --account (like globus1's AccountingStorageEnforce=none / account_required: false).
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/none

SlurmctldDebug=info
SlurmdDebug=info

# The default's two 4-CPU nodes. `main` keeps the default partition's name and role; `shared` hands out slices and bills
# per core; `whole` hands out only whole nodes.
NodeName=c[1-2] CPUs=4 RealMemory=4000 State=UNKNOWN
PartitionName=main   Nodes=c[1-2] Default=YES MaxTime=2-00:00:00 State=UP
PartitionName=shared Nodes=c[1-2] Default=NO  MaxTime=2-00:00:00 OverSubscribe=NO TRESBillingWeights=CPU=1.0 State=UP
PartitionName=whole  Nodes=c[1-2] Default=NO  MaxTime=2-00:00:00 OverSubscribe=EXCLUSIVE State=UP
