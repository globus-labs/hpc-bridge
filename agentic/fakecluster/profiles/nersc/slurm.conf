# hpc-bridge fake cluster — slurm.conf for the `nersc` profile (mounted from profiles/nersc/ at run time).
# Deliberately minimal and container-friendly: no cgroups, no task affinity, munge auth,
# accounting through slurmdbd so `sacct` works (the harness postchecks read squeue/sacct).
ClusterName=fake
SlurmctldHost=slurmctld

AuthType=auth/munge
CredType=cred/munge
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SwitchType=switch/none
ReturnToService=2
MailProg=/bin/true

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldPort=6817
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm

# Containers all see the host VM's CPUs/RAM; config_overrides makes slurmd trust the NodeName
# line instead of refusing to register on a hardware mismatch.
SlurmdParameters=config_overrides

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# Accounting via slurmdbd (+ MariaDB), ENFORCED: a job's account must be a valid association and its QOS one the
# association may use (setup.d/slurmctld-nersc.sh: debug/regular/shared for every pool user, realtime for none).
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos
JobAcctGatherType=jobacct_gather/none

# The site's submit filter (job_submit.lua): the node type and a QOS-or-partition name pick the real partition.
JobSubmitPlugins=lua
GresTypes=gpu
# Reject at SUBMIT a job that exceeds its partition's limits, the way sites do.
EnforcePartLimits=ALL

SlurmctldDebug=info
SlurmdDebug=info

# Three compute nodes, each with its node type as a FEATURE (-C cpu / -C gpu): c1, c2 are CPU nodes, c3 the GPU node
# (two declared, device-less GPUs). Perlmutter's partition names: `system` is the default in sinfo, but the submit
# filter routes every job itself, to regular_milan_ss11, shared_milan_ss11 or gpu_ss11; realtime_ss11 takes only the
# realtime QOS.
NodeName=c[1-2] CPUs=4 RealMemory=4000 Features=cpu State=UNKNOWN
NodeName=c3 CPUs=4 RealMemory=4000 Gres=gpu:2 Features=gpu State=UNKNOWN
PartitionName=system             Nodes=c[1-3] Default=YES MaxTime=2-00:00:00 State=UP
PartitionName=regular_milan_ss11 Nodes=c[1-2] Default=NO  MaxTime=2-00:00:00 State=UP
PartitionName=shared_milan_ss11  Nodes=c[1-2] Default=NO  MaxTime=2-00:00:00 State=UP
PartitionName=realtime_ss11      Nodes=c[1-2] Default=NO  MaxTime=12:00:00   AllowQos=realtime State=UP
PartitionName=gpu_ss11           Nodes=c3     Default=NO  MaxTime=2-00:00:00 State=UP
