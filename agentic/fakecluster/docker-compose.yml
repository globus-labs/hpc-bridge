# hpc-bridge fake cluster — a Docker-simulated Slurm cluster that stands in for globus1 for live
# hpc-bridge testing when the lab cluster is contended. See README.md for the commands.
#
#   mysql ─▶ slurmdbd ─▶ slurmctld ─▶ { c1, c2 (slurmd) , login (sshd) }
#
# Shared volumes: `munge` (the generated auth key) and `home` (/home on login AND compute — the
# endpoint venv + session scratch under $HOME must be visible to the workers). `home` is mounted `nocopy`: the
# entrypoint builds every home from /etc/skel, and Docker's copy of the image's own /home into a fresh volume raced
# when several containers started on it at once ("mkdir …/hpcb-fake_home/_data/ubuntu: file exists", 2026-10-23:
# the cluster never came up and the whole default profile was INFRA).
# Project name is fixed so the network is predictable: `hpcb-fake_default` (the agentic jail can
# join it and reach `login:22` with no port mapping or ssh alias).
name: hpcb-fake

x-slurm: &slurm
  build: .
  image: hpcb-fake:latest
  platform: linux/arm64
  environment:
    SLURM_DB_PASS: ${SLURM_DB_PASS:-slurm-local-dev}   # local throwaway fixture, not a secret (private network, no published port)
  volumes:
    - munge:/etc/munge
    # the active PROFILE (profiles/<name>/): slurm.conf, optional gres.conf / job_submit.lua / setup.d/<role>.sh —
    # the entrypoint applies it at start. bin/up.sh sets HPCB_FAKE_PROFILE_DIR from --profile / HPCB_FAKE_PROFILE.
    - ${HPCB_FAKE_PROFILE_DIR:-./profiles/default}:/etc/hpcb/profile:ro
  restart: unless-stopped

services:
  mysql:
    image: mariadb:11.8   # pinned LTS (the floating `11` tag resolved to 11.8 anyway; EOL 2028-06)
    platform: linux/arm64
    environment:
      MARIADB_ROOT_PASSWORD: ${SLURM_DB_PASS:-slurm-local-dev}
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: ${SLURM_DB_PASS:-slurm-local-dev}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped

  slurmdbd:
    <<: *slurm
    hostname: slurmdbd
    command: [slurmdbd]
    depends_on:
      mysql:
        condition: service_healthy

  slurmctld:
    <<: *slurm
    hostname: slurmctld
    command: [slurmctld]
    depends_on: [slurmdbd]
    volumes:
      - munge:/etc/munge
      - slurmctld-state:/var/spool/slurmctld
      - ${HPCB_FAKE_PROFILE_DIR:-./profiles/default}:/etc/hpcb/profile:ro

  c1:
    <<: *slurm
    hostname: c1
    command: [slurmd]
    depends_on: [slurmctld]
    volumes:
      - munge:/etc/munge
      - home:/home:nocopy
      - ${HPCB_FAKE_PROFILE_DIR:-./profiles/default}:/etc/hpcb/profile:ro

  c2:
    <<: *slurm
    hostname: c2
    command: [slurmd]
    depends_on: [slurmctld]
    volumes:
      - munge:/etc/munge
      - home:/home:nocopy
      - ${HPCB_FAKE_PROFILE_DIR:-./profiles/default}:/etc/hpcb/profile:ro

  login:
    <<: *slurm
    hostname: login
    command: [login]
    depends_on: [slurmctld]
    ports:
      - "${HPCB_FAKE_SSH_PORT:-2222}:${HPCB_FAKE_SSHD_PORT:-22}"   # host-side channel (node gate, cleanup); an MFA profile points it at its key-only sshd
    volumes:
      - munge:/etc/munge
      - home:/home:nocopy
      # The freshly generated TEST public key (lives outside the repo; bin/up.sh creates it).
      - ${HPCB_FAKE_KEY_PUB:-~/.ssh/hpcb-fake.pub}:/run/hpcb/authorized_keys:ro
      - ${HPCB_FAKE_PROFILE_DIR:-./profiles/default}:/etc/hpcb/profile:ro

volumes:
  munge:
  home:
  mysql:
  slurmctld-state:
