[project]
name = "hpc-bridge"
version = "0.1.17"
description = "Extend AI coding agents into HPC via Globus Compute"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.28.1,<2", "pydantic>=2", "pyyaml>=6", "globus-sdk>=4.4,<5", "globus-compute-sdk>=4.15"]  # the SDK is imported at module load (credentials/remote): core, not optional  # mcp<2: 2.x renames FastMCP/MCPServer + the import path (planned migration); >=1.28.1 = the WebSocket advisory fix

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=0.23", "jinja2>=3", "ruff>=0.16"]  # pytest-asyncio 1.4 needs pytest>=8.4
integration = [
    # The endpoint daemon (local provisioning) is Unix-only — it pulls pyprctl +
    # python-daemon, which have no Windows wheels and break `pip install` there.
    # The marker keeps `[integration]` installable on every OS; the SDK (dispatch /
    # BYO via HPC_BRIDGE_ENDPOINT_ID) is cross-platform and is all non-Linux needs.
    "globus-compute-endpoint>=4.15; sys_platform == 'linux'",
]

[project.scripts]
hpc-bridge = "hpc_bridge.server:main"
hpc-bridge-catalog = "hpc_bridge.catalog.ingest:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_bridge"]

# Ship the driving-hpc SKILL.md INSIDE the wheel so an installed server (uvx/pip — non-Claude-Code hosts) can serve
# it over the `hpcbridge://guidance/operations` MCP resource. It lives at skills/driving-hpc/ for Claude Code's skill
# system (a sibling of src/, so not packaged by default); force-include copies it into the package as _guidance/.
# The Claude Code marketplace install is unaffected — it ships the whole plugin directory, skill included.
[tool.hatch.build.targets.wheel.force-include]
"skills/driving-hpc/SKILL.md" = "hpc_bridge/_guidance/SKILL.md"

# This plugin launches via `uvx --from <repo> hpc-bridge`. uv's default cache heuristic
# rebuilds a local dir dependency only when pyproject.toml/setup.py/setup.cfg or the
# top-level `src/` dir changes — NOT when files *inside* src/ change. That let a stale
# wheel keep running after edits to src/hpc_bridge/*.py (the server ran old code). Track
# every source file so a fresh `uvx` (new session) always rebuilds. Custom cache-keys
# replace the defaults, so pyproject.toml must be listed explicitly.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.yaml" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # unset -> a PytestDeprecationWarning at configure time on every run
testpaths = ["tests"]
markers = ["real_catalog: the test may build the real catalog (the hermetic tier forbids the live registry by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["agentic/runs", "agentic/fakecluster", "docs", "agentic/harness/inference_auth_token.py"]  # last: vendored upstream (MIT), kept unmodified

[tool.ruff.lint]
# The rule set the code's existing `# noqa` annotations already imply (E/F/I/B/BLE/A); they were
# ornamental until CI ran ruff (dependency audit 2026-09-03). E501 is deferred: the code wraps at
# ~110 by hand and the long lines are notices; tighten after the server-module split.
select = ["E", "F", "I", "B", "BLE", "A", "RUF", "UP", "RET", "PIE", "PLE", "PLW1510", "SIM", "ISC", "ERA", "T10", "PGH",
          "S102", "S602", "S604", "S605", "S606", "S108"]
ignore = ["SIM105", "RUF001", "RUF002", "RUF003", "ISC004", "PLW1510", "RUF005"]  # PLW1510: every subprocess.run here handles rc explicitly; RUF005: style  # SIM105 would delete reasoned BLE001 noqas; RUF00x = deliberate ×/–; ISC004 = wrapped strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S108"]
"agentic/*" = ["E501"]
"src/hpc_bridge/config.py" = ["S108"]  # the third-fallback ControlMaster dir; owner-checked below

[tool.mypy]
python_version = "3.11"
files = ["src/hpc_bridge"]
ignore_missing_imports = true      # mcp / globus_sdk / globus_compute_sdk stubs are partial
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]            # strict on the pure leaves (mypy has no per-module `strict`)
module = ["hpc_bridge.context", "hpc_bridge.config", "hpc_bridge.cost", "hpc_bridge.models",
          "hpc_bridge.shapes", "hpc_bridge.lifecycle", "hpc_bridge.profile"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true
extra_checks = true
disallow_subclassing_any = true
