name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock:
    name: lockfile in step with pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv lock --check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uvx ruff@0.16.6 check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv sync --extra dev --extra integration
      - run: uv run --with mypy python -m mypy

  test:
    name: pytest (py${{ matrix.python }}, ${{ matrix.os }})
    # Both coreutils the node-side shell meets: GNU (ubuntu-24.04, as on RHEL-family HPC nodes) and uutils (ubuntu-latest
    # is 26.04 since 2026-11, whose Rust coreutils broke the endpoint evidence check's `date -d`).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --extra dev --extra integration
      - name: unit tier (hermetic)
        run: uv run python -m pytest -q -W error::DeprecationWarning
      - name: agentic grading core (hermetic)
        working-directory: agentic/harness
        run: uv run --project ../.. python -m pytest -q -W error::DeprecationWarning

  audit:
    name: advisories in the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv export --all-extras --no-dev --no-hashes --format requirements-txt -o /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt --progress-spinner off
