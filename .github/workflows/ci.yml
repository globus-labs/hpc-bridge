name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock:
    name: lockfile in step with pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv lock --check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uvx ruff@0.16.6 check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv sync --extra dev --extra integration
      - run: uv run --with mypy python -m mypy

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --extra dev --extra integration
      - name: unit tier (hermetic)
        run: uv run python -m pytest -q -W error::DeprecationWarning
      - name: agentic grading core (hermetic)
        working-directory: agentic/harness
        run: uv run --project ../.. python -m pytest test_invariants.py test_pool_and_cluster_ops.py test_scenario_knobs.py test_human_sim.py test_runner.py test_provenance.py test_targets.py test_hermes_trace.py test_hermes_setup.py test_acp_client.py test_hermes_runner.py test_claude_transcript.py test_acp_trace.py test_regrade.py test_acp_runner.py -q -W error::DeprecationWarning

  audit:
    name: advisories in the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.9" }
      - run: uv export --all-extras --no-dev --no-hashes --format requirements-txt -o /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt --progress-spinner off
