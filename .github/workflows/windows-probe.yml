name: windows-probe
# A diagnostic, not a gate. A Windows user saw "Failed to reconnect to plugin:hpc-bridge … CONNECTION_CLOSED".
# Does hpc-bridge's MCP server run on Windows, and does Claude Code start it through the plugin's launcher
# (bin/run-with-uv, a /bin/sh script)? Run on Windows Server (x64) and Windows 11 (arm64), with uv from the CI action
# (on PATH), from the official installer (only in ~/.local/bin, as on a laptop whose PATH lacks it) and with no uv.
# Every check continues on failure so one run answers all of them; each job's summary lists actual vs expected.
# Runs only on pushes to its own branch, or by hand.
on:
  push:
    branches: [ci/windows-probe]
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.os }} / uv from ${{ matrix.uv }}${{ matrix.python && ' / x64 python' || '' }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}   # empty = uv's default for the machine
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, uv: action }
          - { os: windows-11-arm, uv: action }
          - { os: windows-latest, uv: installer }
          - { os: windows-11-arm, uv: installer }
          - { os: windows-latest, uv: none }
          # Windows on Arm with an x64 Python (run under Windows' x64 emulation): cryptography has no win_arm64
          # wheel after 46.0.3, so arm64 fails to build it; its x64 wheel needs no build.
          - { os: windows-11-arm, uv: action, python: cpython-3.13-windows-x86_64-none }
    steps:
      - uses: actions/checkout@v4

      - name: Take any preinstalled uv off PATH (installer / none)
        if: matrix.uv != 'action'
        shell: pwsh
        run: |
          $dirs = $env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }
          "PATH=$($dirs -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($c in "$env:USERPROFILE\.local\bin\uv.exe", "$env:USERPROFILE\.cargo\bin\uv.exe") {
            if (Test-Path $c) { Write-Output "found $c before install: moving it aside"; Move-Item $c "$c.preinstalled" }
          }

      - name: uv from the CI action
        if: matrix.uv == 'action'
        uses: astral-sh/setup-uv@v6

      - name: uv from the official installer (not added to this job's PATH)
        if: matrix.uv == 'installer'
        shell: pwsh
        run: powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"

      - name: Record which uv this job has
        id: which
        shell: pwsh
        run: |
          $uv = switch ('${{ matrix.uv }}') {
            'action'    { (Get-Command uv).Source }
            'installer' { "$env:USERPROFILE\.local\bin\uv.exe" }
            default     { '' }
          }
          "HPCB_UV=$uv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "uv for this job: '$uv'; uv on PATH: '$((Get-Command uv -ErrorAction SilentlyContinue).Source)'"
          if ($uv) { & $uv --version }

      - name: "1. The server starts and lists its tools (uv run, no launcher)"
        id: server
        if: matrix.uv != 'none'
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:HPCB_UV run --locked --extra integration python .github/windows-probe/mcp_probe.py $env:HPCB_UV run --locked --extra integration hpc-bridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: "2. Expected to fail: Windows can't execute the sh launcher itself (Claude Code runs it, see 4-5)"
        id: spawn
        continue-on-error: true
        shell: pwsh
        run: node .github/windows-probe/spawn_probe.js "$env:GITHUB_WORKSPACE/bin/run-with-uv" --version

      - name: "3. The launcher finds uv when Git Bash runs it"
        id: gitbash
        continue-on-error: true
        shell: bash
        run: sh ./bin/run-with-uv --version

      - name: Install Claude Code
        id: cc_install
        continue-on-error: true
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: "4. Claude Code connects through the launcher (server added by hand)"
        id: cc_list
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          MCP_TIMEOUT: "180000"   # a first `uv run` may still be resolving; give it time
        run: |
          set -x
          claude mcp add hpcb-launcher --scope user -e HPC_BRIDGE_OMIT_INSTRUCTIONS=1 -- "$GITHUB_WORKSPACE/bin/run-with-uv" run --locked --directory "$GITHUB_WORKSPACE" --extra integration hpc-bridge
          cd "$RUNNER_TEMP"   # away from the repo's own .mcp.json
          claude mcp list | tee "$RUNNER_TEMP/mcp-list.txt"
          grep -E "^hpcb-launcher" "$RUNNER_TEMP/mcp-list.txt" | grep -qi "connected"

      - name: "5. Claude Code loads the plugin itself (--plugin-dir) and connects"
        id: cc_plugin
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          MCP_TIMEOUT: "180000"
        run: |
          set -x
          cd "$RUNNER_TEMP"
          claude --plugin-dir "$GITHUB_WORKSPACE" mcp list | tee "$RUNNER_TEMP/plugin-list.txt"
          grep -E "^plugin:hpc-bridge:endpoint" "$RUNNER_TEMP/plugin-list.txt" | grep -qi "connected"

      - name: "6. What Claude Code's debug log shows when the plugin fails (no uv only)"
        if: matrix.uv == 'none'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          claude --debug --plugin-dir "$GITHUB_WORKSPACE" mcp list 2>&1 | grep -iE "hpc-bridge|run-with-uv|uv|exit|closed|stderr" | head -40 || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          case "${{ matrix.uv }}" in
            none) want_server="skipped"; want_bash="failure"; want_cc="failure" ;;
            *)    want_server="success"; want_bash="success"; want_cc="success" ;;
          esac
          {
            echo "### ${{ matrix.os }} / uv from ${{ matrix.uv }} ${{ matrix.python }}"
            echo "| check | actual | expected |"
            echo "|---|---|---|"
            echo "| 1. server starts and lists its tools (uv run) | ${{ steps.server.outcome }} | $want_server |"
            echo "| 2. Windows executes the sh launcher itself | ${{ steps.spawn.outcome }} | failure |"
            echo "| 3. launcher finds uv under Git Bash | ${{ steps.gitbash.outcome }} | $want_bash |"
            echo "| Claude Code installs | ${{ steps.cc_install.outcome }} | success |"
            echo "| 4. Claude Code connects through the launcher | ${{ steps.cc_list.outcome }} | $want_cc |"
            echo "| 5. Claude Code connects to the plugin (--plugin-dir) | ${{ steps.cc_plugin.outcome }} | $want_cc |"
          } >> "$GITHUB_STEP_SUMMARY"
