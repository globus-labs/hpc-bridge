<!doctype html>
<!-- The README's wordmark: wordmark.png for GitHub's light page, wordmark-dark.png for its dark one.
     scripts/readme-media/build.sh renders each <figure data-out> at 2x on a transparent background (render.mjs marks).
     System fonts only (SF Mono on macOS): an <img> can't load web fonts, and the PNG needs none. -->
<html>
<head>
<meta charset="utf-8">
<style>
:root { --ink: #10233a; --acc: #0b7f8a; }
body { margin: 0; padding: 20px; display: grid; gap: 20px; justify-content: start; background: transparent; }
figure { margin: 0; width: 560px; height: 140px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
figure.dark { --ink: #e6edf3; --acc: #56d0d6; }
/* A REPL's prompt: SF Mono semibold, a chevron and a block cursor in the accent. */
.mark { display: flex; align-items: center; font: 600 70px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; }
.chev { width: 34px; height: 56px; margin-right: 20px; overflow: visible; }
.chev path { fill: none; stroke: var(--acc); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.cur { display: inline-block; width: 0.5em; height: 0.92em; margin-left: 10px; background: var(--acc); border-radius: 3px; opacity: 0.85; transform: translateY(2px); }
</style>
</head>
<body>
<figure data-out="wordmark.png"><div class="mark"><svg class="chev" viewBox="0 0 34 56" aria-hidden="true"><path d="M 6 8 L 28 28 L 6 48" /></svg>hpc-bridge<span class="cur"></span></div></figure>
<figure class="dark" data-out="wordmark-dark.png"><div class="mark"><svg class="chev" viewBox="0 0 34 56" aria-hidden="true"><path d="M 6 8 L 28 28 L 6 48" /></svg>hpc-bridge<span class="cur"></span></div></figure>
</body>
</html>
