<!doctype html>
<!-- The README's wordmark: one image, a small terminal tile, so it reads the same on GitHub's light and dark pages.
     A light/dark pair behind <picture media="(prefers-color-scheme: dark)"> follows the BROWSER's colour scheme, not
     GitHub's theme: with the OS dark and GitHub light, the light-ink variant landed on a white page (2026-11-11).
     scripts/readme-media/build.sh renders each <figure data-out> at 2x on a transparent background (render.mjs marks).
     System fonts only (SF Mono on macOS): an <img> can't load web fonts, and the PNG needs none. -->
<html>
<head>
<meta charset="utf-8">
<style>
:root { --ink: #e6edf3; --acc: #56d0d6; --tile: #10233a; --edge: rgba(255, 255, 255, 0.10); }
body { margin: 0; padding: 20px; display: grid; gap: 20px; justify-content: start; background: transparent; }
/* The tile: the hero recording's navy, a shade lighter than GitHub's dark page, with a faint edge to hold it there. */
figure { margin: 0; width: 560px; height: 140px; display: flex; align-items: center; justify-content: center;
         color: var(--ink); background: var(--tile); border: 1px solid var(--edge); border-radius: 18px;
         box-sizing: border-box; }
/* A REPL's prompt: SF Mono semibold, a chevron and a block cursor in the accent. */
.mark { display: flex; align-items: center; font: 600 64px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; }
.chev { width: 31px; height: 51px; margin-right: 18px; overflow: visible; }
.chev path { fill: none; stroke: var(--acc); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.cur { display: inline-block; width: 0.5em; height: 0.92em; margin-left: 10px; background: var(--acc); border-radius: 3px; opacity: 0.85; transform: translateY(2px); }
</style>
</head>
<body>
<figure data-out="wordmark.png"><div class="mark"><svg class="chev" viewBox="0 0 34 56" aria-hidden="true"><path d="M 6 8 L 28 28 L 6 48" /></svg>hpc-bridge<span class="cur"></span></div></figure>
</body>
</html>
